name: ci

on: [push, pull_request]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go vet ./...

      - run: go test -race ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the filter image and check it runs
        run: |
          docker build --build-arg BINARY=x402-filter --build-arg VERSION=ci -t x402-filter .
          test "$(docker run --rm x402-filter -version)" = ci
