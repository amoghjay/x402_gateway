name: ci

# One run per commit: pull_request covers PR branches, push covers main (and does the
# registry push). Running both on a PR branch gave two check runs with the same name
# per commit, and the ruleset takes the failed one when a transient job fails.
#
# workflow_dispatch exists for the image-bump job below: a PR opened with GITHUB_TOKEN
# triggers no workflows, so the bump job starts this one on its branch to make the
# required checks report.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Docs-only changes skip the real jobs. The workflow itself must still run: the
  # ruleset requires the go / terraform / image checks by name, and a skipped job counts
  # as passed, while a workflow that never runs leaves the PR blocked on "pending".
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            go:
              - "api/**"
              - "cmd/**"
              - "internal/**"
              - "deploy/k8s/crd/**"
              # The envtest suite applies this sample policy.
              - "deploy/k8s/demo/40-paymentpolicy.yaml"
              - "go.mod"
              - "go.sum"
              - ".golangci.yml"
              - "Dockerfile"
              - "Makefile"
              - ".github/workflows/ci.yml"
            terraform:
              - "deploy/terraform/**"
              - ".github/workflows/ci.yml"

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The CRD and DeepCopy methods are generated from markers in api/; a stale commit
      # fails here rather than at kubectl apply.
      - run: make verify-generate

      - run: go vet ./...

      # kube-apiserver + etcd for the reconciler test, at the cluster's Kubernetes
      # version (GKE 1.35). Cached: the download is ~100 MB.
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/kubebuilder-envtest
          key: envtest-1.35.0-${{ runner.os }}
      - run: echo "KUBEBUILDER_ASSETS=$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.25.2 use 1.35.0 -p path)" >> "$GITHUB_ENV"

      - run: go test -race ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  terraform:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.1

      # No credentials in CI: -backend=false validates the configuration without
      # touching state or GCP.
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  # One image per shipped binary (the Makefile's BINARIES), each from the same Dockerfile.
  # A matrix job reports as "image-build (x402-filter)" etc.; the ruleset requires a check
  # named "image", which the aggregate job below provides.
  image-build:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        binary: [x402-filter, x402-controller, x402-settler]
    steps:
      - uses: actions/checkout@v4

      # Pulling the base image from gcr.io has timed out once (2026-10-29); retry the
      # build a few times before calling the job failed.
      - name: Build the ${{ matrix.binary }} image and check it runs
        run: |
          for attempt in 1 2 3; do
            docker build --build-arg BINARY=${{ matrix.binary }} --build-arg VERSION=ci -t ${{ matrix.binary }} . && break
            echo "build attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          test "$(docker run --rm ${{ matrix.binary }} -version)" = ci

  # The one check the ruleset requires. Passes when every image built, and when the
  # matrix was skipped (docs-only change); fails if any image failed or was cancelled.
  image:
    needs: image-build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "image-build: ${{ needs.image-build.result }}"
          case "${{ needs.image-build.result }}" in success|skipped) exit 0 ;; *) exit 1 ;; esac

  # Pushes to Artifact Registry on main only, after every check above passes. A docs-only
  # merge skips go and image, so this is skipped too: nothing changed in the image. Keyless:
  # GitHub's OIDC token is exchanged for a short-lived Google token through the WIF
  # provider (deploy/terraform/wif.tf), which itself only accepts runs on refs/heads/main.
  # Neither value below is a secret; they are Terraform outputs.
  push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the job request GitHub's OIDC token
    env:
      REGISTRY: us-central1-docker.pkg.dev/x402-envoy/x402
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/555787229602/locations/global/workloadIdentityPools/github/providers/x402-gateway
          service_account: x402-ci-push@x402-envoy.iam.gserviceaccount.com
          token_format: access_token

      # Tagged with the commit, so a deployed image always names the code it came from.
      - name: Build and push the images
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          echo "$TOKEN" | docker login -u oauth2accesstoken --password-stdin https://us-central1-docker.pkg.dev
          TAG="${GITHUB_SHA::12}"
          for binary in x402-filter x402-controller x402-settler; do
            docker build --build-arg BINARY="$binary" --build-arg VERSION="$TAG" -t "$REGISTRY/$binary:$TAG" .
            docker push "$REGISTRY/$binary:$TAG"
            echo "Pushed $REGISTRY/$binary:$TAG" >> "$GITHUB_STEP_SUMMARY"
          done

  # After a push, open a PR that points deploy/k8s/x402-system at the new tag and let it
  # auto-merge once its checks pass. A tag only exists after merge, so code and its tag
  # bump can't share a PR; this is the second PR, written by CI. Applying it to the
  # cluster stays manual (kubectl apply). The merge is made with GITHUB_TOKEN, so it
  # starts no workflow on main: no images are built for it and no further bump follows.
  bump:
    needs: push
    runs-on: ubuntu-latest
    concurrency:
      group: image-bump
      cancel-in-progress: false
    permissions:
      contents: write # push the bot/images-* branch
      pull-requests: write # open, close and auto-merge the PR
      actions: write # start ci on the branch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # the ancestry check below needs history

      - name: Open the bump PR and queue it to merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_SHA::12}"
          BRANCH="bot/images-$TAG"
          FILES="deploy/k8s/x402-system/20-filter.yaml deploy/k8s/x402-system/40-controller.yaml deploy/k8s/x402-system/50-settler.yaml"

          # Runs can finish out of order; never move a manifest back to an older commit.
          CURRENT=$(grep -ohE 'x402-settler:[0-9a-f]{12}' deploy/k8s/x402-system/50-settler.yaml | cut -d: -f2)
          if [ -n "$CURRENT" ] && ! git merge-base --is-ancestor "$CURRENT" "$GITHUB_SHA"; then
            echo "main already runs $CURRENT, which is not an ancestor of $TAG; nothing to do" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          sed -i -E "s#(/x402-(filter|controller|settler)):[0-9a-f]{12}\b#\1:$TAG#" $FILES
          if git diff --quiet; then
            echo "manifests already at $TAG" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -q -m "deploy: images $TAG" $FILES
          git push -q origin "$BRANCH"

          # An older bump still waiting is superseded by this one.
          gh pr list --state open --json number,headRefName \
            -q '.[] | select(.headRefName | startswith("bot/images-")) | .number' |
            while read -r n; do
              gh pr close "$n" --delete-branch --comment "Superseded by images $TAG."
            done

          gh pr create --base main --head "$BRANCH" --title "deploy: images $TAG" --body "Images built from $GITHUB_SHA for x402-filter, x402-controller and x402-settler. Opened by ci; it merges itself when the checks pass. Then apply: \`kubectl apply -f deploy/k8s/x402-system/\`."
          gh workflow run ci.yml --ref "$BRANCH"
          gh pr merge "$BRANCH" --auto --merge --delete-branch
          echo "opened the bump to $TAG" >> "$GITHUB_STEP_SUMMARY"
