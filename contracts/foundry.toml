[profile.default]
src = "src"
out = "out"
libs = ["lib"]
gas_price = 1000000000
evm_version = "cancun"
via_ir = true

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
radius_testnet = "https://rpc.testnet.radiustech.xyz"
radius_mainnet = "https://rpc.radiustech.xyz"
