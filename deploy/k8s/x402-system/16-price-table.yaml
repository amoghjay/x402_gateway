# The price table, written by hand until the PaymentPolicy controller (M4) owns it.
# The filter watches it (no restart, a change applies in about a second). A table that
# fails validation is rejected whole and the filter keeps the last good one; check the
# filter's log for "price table rejected" after an edit.
#
# Keys are HTTPRoutes ("httproute/<namespace>/<name>"). "price" is atomic units: "1000"
# is 0.001 SBC. Schema and rules: internal/pricing/pricing.go.
apiVersion: v1
kind: ConfigMap
metadata:
  name: x402-prices
  namespace: x402-system
data:
  prices.json: |
    {
      "schemaVersion": 1,
      "routes": {
        "httproute/demo/httpbin": {
          "network": "eip155:72344",
          "price": "1000",
          "asset": "0x33ad9e4BD16B69B5BFdED37D8B5D9fF9aba014Fb",
          "payTo": "0x2a521BC1C1fda5C366aEf14A8326152de5EBfBe4",
          "assetTransferMethod": "eip3009",
          "maxTimeoutSeconds": 300,
          "failureMode": "Closed",
          "captureMode": "Async",
          "description": "httpbin, one call",
          "mimeType": "application/json",
          "help": {
            "message": "Demo route on Radius testnet; get test SBC from the faucet first."
          }
        }
      }
    }
