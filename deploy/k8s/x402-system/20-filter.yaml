# The x402 filter: Envoy's ext_proc server. It prices routes from the x402-prices
# ConfigMap the controller writes (40-controller.yaml), which it watches through the API
# with the x402-filter ServiceAccount (15-filter-rbac.yaml); answers unpaid requests
# with the 402; and serves paid ones after verifying the signature, reading the payer's
# balance through Redis and reserving there (replay guard, in-flight sum), queueing the
# settlement for the settler (50-settler.yaml).
#
# Two replicas and a PodDisruptionBudget: zero ready filter pods is the worst answer
# (Envoy Gateway rewrites every priced route to a 500). An HPA is backlog.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: x402-filter
  namespace: x402-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: x402-filter
  template:
    metadata:
      labels:
        app: x402-filter
    spec:
      serviceAccountName: x402-filter
      # On the request path of every priced route: never on spot.
      nodeSelector:
        pool: system
      # Spread across nodes when there is more than one; with one system node both
      # replicas share it, and the PDB still keeps one up through a drain.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: x402-filter
      # Longer than the binary's -drain (20 s), so it finishes draining in-flight streams
      # before the kubelet's SIGKILL.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true # the distroless :nonroot image runs as uid 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: filter
          # Built and pushed by CI from the merge commit (the tag is the commit). The
          # args below need the M5 image; the tag-bump PR after this merges sets it.
          image: us-central1-docker.pkg.dev/x402-envoy/x402/x402-filter:d1094b1f1956
          args:
            # Payments on. Without -redis every priced request gets the 402.
            - -redis=redis.x402-system.svc:6379
            - -networks=testnet
            - -deadline=150ms
          env:
            # Where the price-table ConfigMap lives: the filter's own namespace.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Go's GC aims to stay under this, well inside the 128Mi limit. client-go's
            # cost was measured at 2.1 MiB of heap after init; lower the limit once the
            # live RSS is known.
            - name: GOMEMLIMIT
              value: 100MiB
            # A keyed RPC URL would come from a Secret here, as RADIUS_RPC_URL; keyless
            # for now, so the network's public endpoint is used and nothing is secret.
          ports:
            - name: grpc
              containerPort: 9002
          # The kubelet speaks the standard gRPC health protocol natively.
          # Readiness asks for the "readiness" service: SERVING once the first price table
          # has loaded, NOT_SERVING before that and while draining on SIGTERM.
          # Liveness asks for the whole server (""), which a missing price table does not
          # fail: the pod stays alive and unready instead of restarting in a loop.
          readinessProbe:
            grpc:
              port: 9002
              service: readiness
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: 9002
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true # a static binary that writes nothing
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: x402-filter
  namespace: x402-system
spec:
  selector:
    app: x402-filter
  ports:
    - name: grpc
      port: 9002
      targetPort: grpc
      appProtocol: kubernetes.io/h2c # gRPC is HTTP/2 without TLS on this hop (TLS is backlog)
---
# A node drain or an upgrade may take one filter pod down at a time, never both.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: x402-filter
  namespace: x402-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: x402-filter
