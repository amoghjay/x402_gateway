# Attaches httpbin to the shared Gateway. Envoy Gateway programs Envoy from this: any
# path on the public IP goes to the httpbin Service. Delete this and the same request
# gets a 404 from Envoy (the Phase 1 break-it drill).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin
  namespace: demo
spec:
  parentRefs:
    - name: x402
      namespace: gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: httpbin
          port: 8080
